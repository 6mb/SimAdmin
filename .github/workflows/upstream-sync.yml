name: Sync Upstream

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync fork with upstream
    if: github.repository == '6mb/SimAdmin'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync default branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          result="$(gh api -X POST "repos/${GITHUB_REPOSITORY}/merge-upstream" -f branch=main)"
          echo "$result" | jq .

      - name: Sync tags
        run: |
          set -euo pipefail

          git remote add upstream https://github.com/3899/SimAdmin.git
          git fetch origin --prune --tags
          git fetch upstream --prune --tags

          origin_tags="$RUNNER_TEMP/origin-tags.txt"
          git ls-remote --tags origin > "$origin_tags"

          git for-each-ref --format='%(refname)' refs/tags | while IFS= read -r tag_ref; do
            tag_name="${tag_ref#refs/tags/}"

            if grep -Fq "refs/tags/$tag_name" "$origin_tags"; then
              continue
            fi

            git push origin "$tag_ref:$tag_ref"
          done

      - name: Sync releases and assets
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPO: 3899/SimAdmin
          TARGET_REPO: ${{ github.repository }}
        run: ./.github/scripts/sync-upstream-releases.sh
